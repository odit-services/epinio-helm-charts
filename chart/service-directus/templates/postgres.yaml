{{- if .Values.postgres.enabled }}
  

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "directus.dbname" . }}
spec:
  instances: {{ .Values.postgres.instances }}
  primaryUpdateMethod: switchover
  {{- if and .Values.backup.enabled (eq (include "directus.backup.postgresMethod" .) "cnpg-plugin") }}
  plugins:
    - name: pgdump-backup.cloudnative-pg.io
      enabled: true
  {{- end }}
  storage:
    size: {{ .Values.postgres.persistence.size }}
    storageClass: {{ .Values.postgres.persistence.storageClass }}
  {{- if .Values.postgres.image }}
  imageName: {{ .Values.postgres.image }}
  {{- end }}
  {{- if and (.Values.postgres.majorVersion) (not .Values.postgres.image) }}
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: {{ .Values.postgres.imageCatalog.name}}
    major: {{ .Values.postgres.majorVersion }}
  {{- end }}
{{- end }}