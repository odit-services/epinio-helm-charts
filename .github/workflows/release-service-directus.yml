name: Release service-directus chart

on:
  push:
    tags:
      - 'directus-[0-9]*.[0-9]*.[0-9]*'
      - 'directus-v[0-9]*.[0-9]*.[0-9]*'
  # Manual backfill for chart versions that were never pushed
  # (e.g. tagged before this workflow existed).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. directus-0.18.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install helm
        uses: WyriHaximus/github-action-helm3@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#directus-}"
          VER="${VER#v}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT

      - name: Verify chart version matches tag
        run: |
          CHART_VERSION="$(grep '^version:' chart/service-directus/Chart.yaml | awk '{print $2}')"
          if [ "$CHART_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Chart.yaml version ($CHART_VERSION) does not match tag version (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi

      - name: Lint and template chart
        run: |
          helm lint chart/service-directus
          helm template release chart/service-directus \
            --set ingress.parentDomain=example.com \
            --set postgres.enabled=true \
            --set backup.enabled=true > /dev/null
          helm template release chart/service-directus \
            --set ingress.parentDomain=example.com \
            --set postgres.enabled=true \
            --set backup.enabled=true \
            --set backup.postgres.method=cnpg-plugin > /dev/null

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        run: |
          helm package chart/service-directus
          helm push "epinio-service-directus-${{ steps.version.outputs.VERSION }}.tgz" oci://ghcr.io/odit-services

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: |
            epinio-service-directus-${{ steps.version.outputs.VERSION }}.tgz
